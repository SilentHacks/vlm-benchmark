[project]
name = "vlm-benchmark"
version = "0.2.0"
description = "Benchmark vision-language models on image datasets with pluggable metrics, cost tracking, and a web dashboard"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.urls]
Homepage = "https://github.com/SilentHacks/vlm-benchmark"
Repository = "https://github.com/SilentHacks/vlm-benchmark"
Issues = "https://github.com/SilentHacks/vlm-benchmark/issues"

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/api",
    "packages/cli",
]

[tool.uv.sources]
vlm-bench-core = { workspace = true }
vlm-bench-api = { workspace = true }
vlm-bench-cli = { workspace = true }

[dependency-groups]
dev = [
    "vlm-bench-cli",
    "vlm-bench-api",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["packages/core/src", "packages/cli/src", "packages/api/src"]

[tool.hatch.build.targets.wheel]
packages = []
