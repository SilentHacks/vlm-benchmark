[project]
name = "vlm-benchmark"
version = "0.1.0"
description = "VLM benchmarking platform — compare vision models on datasets with pluggable metrics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/api",
    "packages/cli",
]

[tool.uv.sources]
vlm-bench-core = { workspace = true }
vlm-bench-api = { workspace = true }
vlm-bench-cli = { workspace = true }

[dependency-groups]
dev = [
    "vlm-bench-cli",
    "vlm-bench-api",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["packages/core/src", "packages/cli/src", "packages/api/src"]

[tool.hatch.build.targets.wheel]
packages = []
