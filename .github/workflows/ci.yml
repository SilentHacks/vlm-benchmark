name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Generate fixtures
        run: uv run python scripts/generate_fixtures.py

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Validate example config
        run: uv run vlm-bench validate -c configs/example-bench.yaml

      - name: Run pytest
        run: uv run pytest -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/web/package-lock.json

      - name: Install web deps
        working-directory: packages/web
        run: npm ci

      - name: Build web
        working-directory: packages/web
        run: npm run build
