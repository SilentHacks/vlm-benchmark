[project]
name = "vlm-bench-core"
version = "0.1.0"
description = "VLM benchmark core: orchestration, adapters, metrics, storage"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "jsonschema>=4.0",
    "jsonpath-ng>=1.6",
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vlm_bench"]
