[project]
name = "vlm-bench-cli"
version = "0.3.0"
description = "VLM benchmark CLI"
requires-python = ">=3.11"
dependencies = [
    "vlm-bench-core",
    "typer>=0.12",
    "rich>=13.0",
    "jinja2>=3.1",
]

[project.scripts]
vlm-bench = "vlm_bench_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vlm_bench_cli"]

[tool.uv.sources]
vlm-bench-core = { workspace = true }
